[project]
name = "london-marathon-histograms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.5"
dependencies = [
    "ipython>=9.5.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "pandas-stubs>=2.3.2.250926",
    "plotly>=6.3.1",
    "plotly-stubs>=0.0.6",
    "pyqt6>=6.10.0", # needed for interactive matplotlib
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = "jupyter"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["RET503"]
