<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>London Marathon Stats</title>

    <!-- Load Plotly for charting -->
    <script src="https://cdn.plot.ly/plotly-3.5.1.min.js"></script>

    <script src="data.js"></script>
    <script src="analysis.js"></script>

    <style>
        /* The container holding all your plot instances */
        .plots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 350px), 1fr));
            gap: 20px;
            margin-top: 20px;
            width: 100%;
        }

        /* Styling for each individual plot "card" */
        .plot-instance {
            width: 100%;
            min-width: 0;
            background: white;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            /*
            display: flex;
            flex-direction: column;
            */
        }

        /* Ensure the chart div itself fills the container */
        [id$="-chart"] {
            width: 100% !important;

            /* INFO: to override plotly settings */
            /* height: 400px !important; */
        }

        /* Make the internal controls look like a neat toolbar */
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px dashed #ddd;
            margin-bottom: 15px;
        }

        .controls-row select {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        table {
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }

        th,
        td {
            padding: 10px 15px;
            text-align: right;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f1f3f5;
            color: #333;
            font-weight: 600;
        }

        /* Align the text labels to the left and numbers to the right */
        th:first-child,
        td:first-child {
            text-align: left;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        * {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            background-color: #f8f9fa;
        }

        .dashboard {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .header-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 25px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        select {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            min-width: 50px;
        }

        label {
            font-size: 12px;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="dashboard">
        <div class="plots-grid">
            <div id="summary-count" class="plot-instance"></div>
            <div id="summary-percent" class="plot-instance"></div>
        </div>
        <hr style="margin: 40px 0;">

        <h3>Comparative Analysis</h3>
        <p style="color: #666;">Use the filters below to compare different years or categories side-by-side.</p>

        <div class="plots-grid">
            <div id="plot-area-1" class="plot-instance"></div>
            <div id="plot-area-2" class="plot-instance"></div>
        </div>
    </div>

    <script>

        // Wait for the page to load, then initialize using the 'histogramData' from data.js
        window.onload = function () {
            // Draw the new summary widgets first
            //drawSummaryTable(); // Injects the text table
            drawSummaryChart('summary-count', 'count');
            drawSummaryChart('summary-percent', 'percent');

            createHistogramInstance('plot-area-1');
            createHistogramInstance('plot-area-2');
        };


    </script>

</body>

</html>
